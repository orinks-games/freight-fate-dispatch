[project]
name = "freight-fate-dispatch"
version = "0.1.0"
description = "Freight Fate: Dispatch — run the other side of the board. Audio-first dispatcher sim in the Freight Fate universe."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Orinks" }]
dependencies = [
    "pygame>=2.6",
    "prismatoid>=0.16",
    "freightverse",
]

[project.scripts]
freight-fate-dispatch = "ff_dispatch.app:main"

[tool.uv.sources]
# Private shared-universe package. Pin a tag once the schema settles; while
# both projects live on this machine the local path keeps iteration instant.
freightverse = { path = "../freightverse", editable = true }
# freightverse = { git = "https://github.com/Orinks/freightverse", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ff_dispatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
