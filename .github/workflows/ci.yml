name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FF_DISPATCH_NO_SPEECH: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freight-fate-dispatch
    steps:
      - uses: actions/checkout@v4
        with:
          path: freight-fate-dispatch

      # freightverse is private and resolved from the sibling path in
      # pyproject.toml. FREIGHTVERSE_TOKEN is a fine-grained PAT with read
      # access to Orinks/freightverse.
      - uses: actions/checkout@v4
        with:
          repository: Orinks/freightverse
          token: ${{ secrets.FREIGHTVERSE_TOKEN }}
          path: freightverse

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
