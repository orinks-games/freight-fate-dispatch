name: CI
on:
  # Not on every push to main: private-repo Windows and macOS minutes bill at
  # 2x and 10x. PRs, release tags and workflow_dispatch run it, and every run
  # packages all three platforms as downloadable tester artifacts.
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The bundled SDL2 source declares a cmake_minimum_required older than
  # CMake 4 accepts; this is CMake's own escape hatch for exactly that.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 22.04 for Linux: the executable carries its build host's glibc as a floor.
        os: [windows-latest, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      FF_DISPATCH_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  package:
    name: package (${{ matrix.os }})
    needs: [fmt, test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Read the ff-core pin
        id: pin
        shell: bash
        run: echo "ref=$(grep '^ff-core' Cargo.toml | grep -oE '(tag|rev) = "[^"]+"' | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Orinks/Freight-fate
          ref: ${{ steps.pin.outputs.ref }}
          path: ff
      - name: Bake world.ffdata from the pinned Freight Fate
        working-directory: ff
        shell: bash
        run: CARGO_TARGET_DIR=../target/ff-bake cargo run --release -p ff-core --bin ff-bake -- --data-dir data --out ../world.ffdata
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage/FreightFateDispatch"
          New-Item -ItemType Directory -Force "$stage/freight_fate/data", dist | Out-Null
          Copy-Item target/release/ff-dispatch.exe "$stage/FreightFateDispatch.exe"
          Copy-Item target/release/SDL2.dll $stage
          Copy-Item world.ffdata "$stage/freight_fate/data/world.ffdata"
          Copy-Item ff/data/carriers.json "$stage/freight_fate/data/carriers.json"
          Copy-Item README.md, LICENSE $stage
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $crt = & $vswhere -latest -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\*.dll"
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_atomic_wait.dll") {
            $src = $crt | Where-Object { (Split-Path $_ -Leaf) -eq $dll } | Select-Object -First 1
            if (-not $src) { throw "missing $dll" }
            Copy-Item $src $stage
          }
          Compress-Archive -Path $stage -DestinationPath "dist/FreightFateDispatch-$env:LABEL-windows-portable.zip"
          "EXE=$stage/FreightFateDispatch.exe" >> $env:GITHUB_ENV
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          exe=$(scripts/package.sh "$LABEL" world.ffdata ff/data/carriers.json | tail -1)
          echo "EXE=$exe" >> "$GITHUB_ENV"
      - name: Smoke the packaged game
        shell: bash
        env:
          FF_DISPATCH_NO_SPEECH: "1"
          FF_DISPATCH_DATA_DIR: ${{ runner.temp }}/dispatch
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          said=$("$EXE" --seed 7 --script tests/fixtures/first_shift.keys) || { echo "$said"; exit 1; }
          grep -q "Day 2 at" <<< "$said" || { echo "$said"; echo "packaged smoke failed" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum FreightFateDispatch-* > checksums.txt
          gh release create "${{ github.ref_name }}" FreightFateDispatch-* checksums.txt \
            --repo "${{ github.repository }}" --prerelease \
            --title "Dispatch ${{ github.ref_name }}" --notes "Tester beta."
