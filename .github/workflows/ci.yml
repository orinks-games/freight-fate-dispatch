name: CI
on:
  # Packaging and releases only: release tags and workflow_dispatch. Tests
  # run locally, not here. All jobs use GitHub-hosted runners.
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The bundled SDL2 source declares a cmake_minimum_required older than
  # CMake 4 accepts; this is CMake's own escape hatch for exactly that.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # sccache caches compiled crates by content, so a version bump or a fresh
  # checkout recompiles only what changed; rust-cache alone goes cold then.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # world.ffdata is the same file on every platform, so it is baked once on
  # Linux, before packaging, and only when the
  # Freight Fate pin has no cached bake.
  bake:
    runs-on: ubuntu-26.04
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Read the ff-core pin
        id: pin
        run: echo "ref=$(grep '^ff-core' Cargo.toml | grep -oE '(tag|rev) = "[^"]+"' | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: world
          key: world-ffdata-${{ steps.pin.outputs.ref }}
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: Orinks/Freight-fate
          ref: ${{ steps.pin.outputs.ref }}
          path: ff
      - uses: ./.github/actions/linux-deps
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Bake world.ffdata from the pinned Freight Fate
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ff
        run: |
          mkdir -p ../world
          cargo run --release -p ff-core --bin ff-bake -- --data-dir data --out ../world/world.ffdata
          cp data/carriers.json ../world/carriers.json
      - uses: actions/upload-artifact@v4
        with:
          name: world-data
          path: world/*
          if-no-files-found: error

  package:
    name: package (${{ matrix.os }})
    needs: [bake]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      # prism-sys asks CMake for C23. The Windows image's CMake does not map
      # C23 onto MSVC, so use a current CMake that does (/std:clatest).
      - uses: lukka/get-cmake@latest
        if: runner.os == 'Windows'
      # prism-sys's SAPI and screen-reader backends include atlbase.h, and
      # the Windows image ships Visual Studio without the ATL component.
      # Restore ATL from the cache when the MSVC version matches; otherwise
      # add it with the Visual Studio installer and cache it for next time.
      - name: Find the MSVC tools
        id: msvc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools" }
          $ver = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          "vs=$vs" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "atl=$vs\VC\Tools\MSVC\$ver\atlmfc" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: atl-cache
        if: runner.os == 'Windows'
        with:
          path: ${{ runner.temp }}/atlmfc
          key: vs-atlmfc-${{ runner.os }}-${{ matrix.os }}-${{ steps.msvc.outputs.ver }}
      - name: Add ATL to Visual Studio
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VS: ${{ steps.msvc.outputs.vs }}
          ATL: ${{ steps.msvc.outputs.atl }}
          CACHED: ${{ runner.temp }}/atlmfc
        run: |
          if (Test-Path "$env:ATL\include\atlbase.h") { Write-Host "ATL already present"; exit 0 }
          if (Test-Path "$env:CACHED\include\atlbase.h") {
            Copy-Item "$env:CACHED" "$env:ATL" -Recurse -Force
            if (Test-Path "$env:ATL\include\atlbase.h") { Write-Host "ATL restored from cache"; exit 0 }
          }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "modify", "--installPath", "`"$env:VS`"", "--add", "Microsoft.VisualStudio.Component.VC.ATL", "--quiet", "--norestart", "--nocache" -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { throw "Visual Studio installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$env:ATL\include\atlbase.h")) { throw "atlbase.h still missing" }
          if (-not (Test-Path "$env:CACHED\include\atlbase.h")) { Copy-Item "$env:ATL" "$env:CACHED" -Recurse -Force }
      - uses: actions/cache/save@v4
        if: runner.os == 'Windows' && steps.atl-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/atlmfc
          key: vs-atlmfc-${{ runner.os }}-${{ matrix.os }}-${{ steps.msvc.outputs.ver }}
      # The hearken command, from the same Hearken the game pins, so the
      # pin lives in one place: the `hearken = { git, rev }` line.
      - name: Read the Hearken pin
        id: hearken
        shell: bash
        run: |
          line=$(grep '^hearken = ' Cargo.toml)
          echo "git=$(grep -oE 'git = "[^"]+"' <<< "$line" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "kind=$(grep -oE '(tag|rev) = ' <<< "$line" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ref=$(grep -oE '(tag|rev) = "[^"]+"' <<< "$line" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: hearken-cache
        with:
          path: ~/hearken-cli
          key: hearken-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.hearken.outputs.ref }}
      - name: Install the hearken command
        if: steps.hearken-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          cargo install hearken-cli --locked --force --root ~/hearken-cli
          --git "${{ steps.hearken.outputs.git }}"
          --${{ steps.hearken.outputs.kind }} "${{ steps.hearken.outputs.ref }}"
      - uses: actions/download-artifact@v4
        with:
          name: world-data
          path: freight_fate/data
      # Signs as "Developer ID Application: Joshua Tubbs" and notarizes with
      # the App Store Connect key, as Freight Fate's Mac release does. The
      # certificate goes into a throwaway keychain and the key into
      # RUNNER_TEMP, never the checkout or the app. hearken release reads the
      # MACOS_* variables this step sets.
      - name: Import the Developer ID signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::A release must be Developer ID signed and notarized; the signing secrets are missing."
              exit 1
            fi
            echo "::warning::The signing secrets are missing; this Mac package is not signed or notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/dispatch-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer_id.p12"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer_id.p12"
          # The G2 intermediate is not in macOS's system keychain; without it
          # the identity is untrusted and codesign finds nothing to sign with.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="Developer ID Application: Joshua Tubbs ($APPLE_TEAM_ID)"
          security find-identity -v -p codesigning "$keychain" | grep -F "$identity"
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "MACOS_SIGN_IDENTITY=$identity"
            echo "MACOS_SIGN_KEYCHAIN=$keychain"
            echo "MACOS_NOTARY_KEY_PATH=$key_path"
            echo "MACOS_NOTARY_KEY_ID=$ASC_KEY_ID"
            echo "MACOS_NOTARY_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"
      # Builds with the agent server left out, packs the sounds into
      # sounds.pak, seals careers with the key in HEARKEN_SEAL_SECRET, and
      # on a Mac makes and signs the app; then checks and plays the release.
      - name: Release and smoke
        shell: bash
        env:
          HEARKEN_SEAL_SECRET: ${{ secrets.HEARKEN_SEAL_SECRET }}
        run: HEARKEN="$HOME/hearken-cli/bin/hearken" scripts/release.sh "$LABEL"
      # hearken release ships the newest Visual C++ runtime installed but does
      # not compare it with the compiler. An older msvcp140.dll beside the exe
      # wins over System32's and crashes on the newer lock code when speech
      # starts.
      - name: Check the shipped C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VS: ${{ steps.msvc.outputs.vs }}
        run: |
          $stage = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $stage) { throw "no staged release in dist" }
          $tools = [version](Get-Content "$env:VS\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_atomic_wait.dll") {
            $path = Join-Path $stage.FullName $dll
            if (-not (Test-Path $path)) { throw "the release is missing $dll" }
            $v = (Get-Item $path).VersionInfo
            Write-Host "$dll $($v.FileVersion), C++ tools $tools"
            if ([version]::new($v.FileMajorPart, $v.FileMinorPart) -lt [version]::new($tools.Major, $tools.Minor)) {
              throw "$dll is $($v.FileVersion), older than the $tools compiler that built the game"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-${{ runner.os }}
          path: dist/FreightFateDispatch-*
          if-no-files-found: error

  # The release notes are the tag's block in CHANGELOG.md, as Freight Fate
  # does it. This runs first and alone, so a tag whose changelog was never
  # written fails in seconds, not after the packages are built.
  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Write the release notes from CHANGELOG.md
        run: python3 tools/release_notes.py stable --version "${{ github.ref_name }}" --output notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dispatch-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s notes.md
          cd dist && sha256sum FreightFateDispatch-* > checksums.txt
          gh release create "${{ github.ref_name }}" FreightFateDispatch-* checksums.txt \
            --repo "${{ github.repository }}" \
            --title "Dispatch ${{ github.ref_name }}" --notes-file ../notes.md
