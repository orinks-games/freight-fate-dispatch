[package]
name = "ff-dispatch"
version = "0.1.4"
edition = "2021"
rust-version = "1.95"
publish = false

# The program players run, under the name the downloads have always used.
[[bin]]
name = "FreightFateDispatch"
path = "src/main.rs"

# What `hearken release` builds: see "Play and release with the hearken
# command" in Hearken's README. The sounds folder ships as an encrypted
# sounds.pak; freight_fate holds the baked world data, which CI puts there
# before a release (it is not in the repository).
[package.metadata.hearken]
portable = true
pack = true
seal = true
# The ID of the one key every release seals careers with. The key itself is
# the HEARKEN_SEAL_SECRET secret on CI; a release with any other key, or
# none, is refused, because it could not read players' saves.
seal-id = "k1:2de307a1abab8f4d"
include = ["sounds", "README.md", "LICENSE", "freight_fate"]
app-name = "Freight Fate Dispatch"
bundle-id = "net.orinks.freight-fate-dispatch"

[dependencies]
# The one place the ff-core pin lives; CI reads the rev or tag from this line.
ff-core = { git = "https://github.com/Orinks/Freight-fate", rev = "96c92e611900c274d936f16fbc5dc5c179243f94" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip", "platform-verifier"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
# The engine: the window, speech through Prism, menus, settings, help and
# sound, as one facade crate from Hearken's main; the rev is the one place
# the pin lives. build.rs passes on the link arguments it publishes.
hearken = { git = "https://github.com/orinks-games/hearken", rev = "fb6aa78782f6b61a38f2b3c6c8c440f7212138d6", features = ["discord"] }
# The clipboard for the saves-folder field. Windows links the vendored
# prebuilt through build.rs.
sdl2 = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
# Compiles libdbus into the executable for keyring's Secret Service, so the
# game starts on minimal installs without libdbus-1.so.3.
libdbus-sys = { version = "0.2", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[features]
# Hearken's `--agent-server`, so an agent can play a debug build by ear.
# Only a debug build starts it; `hearken release` leaves the feature out.
default = ["agent-server"]
agent-server = ["hearken/agent-server"]

[dev-dependencies]
tempfile = "3"

# The engine's decoders and mixer are unusably slow unoptimized; keep debug
# runs and tests snappy.
[profile.dev.package."*"]
opt-level = 2

# World generation and routing run in every test; unoptimized they take minutes.
[profile.dev.package.ff-core]
opt-level = 3
