[package]
name = "ff-dispatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
# The one place the ff-core pin lives; CI reads the rev or tag from this line.
ff-core = { git = "https://github.com/Orinks/Freight-fate", rev = "96c92e611900c274d936f16fbc5dc5c179243f94" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip", "platform-verifier"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
# 0.1.4 at least: older releases drop static backends, overrun the stack in
# Prism::new, or fail to anchor optional screen-reader backends.
prismer = { version = "0.1.4", features = ["static"] }
# Windows links the vendored prebuilt through build.rs.
sdl2 = "0.38"
lewton = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
# Compiles libdbus into the executable for keyring's Secret Service, so the
# game starts on minimal installs without libdbus-1.so.3.
libdbus-sys = { version = "0.2", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

# The music decoder is unusably slow unoptimized; keep debug runs and tests snappy.
[profile.dev.package.lewton]
opt-level = 3
